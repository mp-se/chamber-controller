name: PlatformIO CI

on: 
  pull_request:
  push:
    branches: 
      - main
      - dev

jobs:
  pio-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
    
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build UI
        working-directory: ui
        run: |
          npm install
          npm run build
          cd ..
          ./copy_ui.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          # intelhex is required by PlatformIO but missing from its dependencies
          python -m pip install platformio intelhex

      - name: PlatformIO Run
        run: |
          pio run \
            --environment chamber-controller-32pro \
            --environment chamber-controller-s2 \
            --environment chamber-controller-s3 \
            --jobs 6 \
            --verbose

      # Pull requests only verify that the build works, nothing is committed
      - uses: EndBug/add-and-commit@v11 # You can change this to use a specific version. https://github.com/marketplace/actions/add-commit
        if: ${{ github.event_name != 'pull_request' }}
        with:
          add: 'bin html'
          author_name: GitHub Action
          author_email: mp-se@noreply.github.com
          default_author: github_actor
          message: 'GitHub Action Build'
          pathspec_error_handling: ignore
